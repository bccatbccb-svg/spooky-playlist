<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🎃 Summon a Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fog"></div>
  <header class="hero poster-hero">
    <img class="poster-img" src="poster.webp" width="765" height="1024" alt="Spooky Birthday Bash — Halloween · Birthday · Rave — Saturday, Nov 7" fetchpriority="high">
    <h1 id="party-name" class="sr-only">Spooky Birthday Bash</h1>
    <p id="party-sub" class="sr-only"></p>
    <p class="demo-banner" id="demo-banner" hidden>Demo mode — songs are only saved in this browser.</p>
  </header>

  <main>
    <section class="card frame" id="who">
      <svg class="mush left" viewBox="0 0 60 80" aria-hidden="true"><path d="M24 40 Q22 62 18 78 H38 Q34 62 34 40Z" fill="#1a0f2e" stroke="#ff3dc9" stroke-width="2"/>
<path d="M4 42 Q6 10 30 8 Q54 10 56 42 Q30 34 4 42Z" fill="#1a0f2e" stroke="#ff3dc9" stroke-width="2.4"/>
<circle cx="20" cy="26" r="4" fill="#ff3dc9"/><circle cx="36" cy="20" r="3" fill="#ff3dc9"/><circle cx="44" cy="32" r="3.5" fill="#ff3dc9"/><circle cx="28" cy="35" r="2.2" fill="#ff3dc9"/></svg><svg class="mush right" viewBox="0 0 60 80" aria-hidden="true"><path d="M24 40 Q22 62 18 78 H38 Q34 62 34 40Z" fill="#1a0f2e" stroke="#a6ff3d" stroke-width="2"/>
<path d="M4 42 Q6 10 30 8 Q54 10 56 42 Q30 34 4 42Z" fill="#1a0f2e" stroke="#a6ff3d" stroke-width="2.4"/>
<circle cx="20" cy="26" r="4" fill="#a6ff3d"/><circle cx="36" cy="20" r="3" fill="#a6ff3d"/><circle cx="44" cy="32" r="3.5" fill="#a6ff3d"/><circle cx="28" cy="35" r="2.2" fill="#a6ff3d"/></svg>
      <label for="name" class="center">Who dares enter?</label>
      <div class="row">
        <input id="name" placeholder="Your name" maxlength="40" autocomplete="name">
      </div>
    </section>

    <section class="card neon" id="summon">
      <div class="summon-head">
        <h2>Summon a song</h2>
        <div id="counter" class="counter"></div>
      </div>
      <div class="search-wrap">
        <input id="q" placeholder="Search a song or artist…" autocomplete="off" class="search-input">
        <div id="results" class="results" hidden></div>
      </div>
      <div class="or"><span>or paste a link</span></div>
      <div id="paste-wrap">
        <div class="ptiles"><button type="button" class="ptile spotify" data-plat="spotify" aria-label="spotify"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0b0b0b"/><path d="M6.5 9.5c3.8-1.2 7.6-.8 11 .9M7.2 12.6c3-.9 6-.6 8.6.8M8 15.5c2.3-.6 4.5-.4 6.4.6" stroke="#1ed760" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button><button type="button" class="ptile apple" data-plat="apple" aria-label="apple"><svg viewBox="0 0 24 24"><path d="M10 17.5V6.5l9-2v11" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="17.5" r="2.5" fill="#fff"/><circle cx="16.5" cy="15.5" r="2.5" fill="#fff"/></svg></button><button type="button" class="ptile youtube" data-plat="youtube" aria-label="youtube"><svg viewBox="0 0 24 24"><path d="M9.5 7.5v9l7.5-4.5z" fill="#fff"/></svg></button><button type="button" class="ptile soundcloud" data-plat="soundcloud" aria-label="soundcloud"><svg viewBox="0 0 24 24"><path d="M9 17h9.5a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.5-1.5z" fill="#fff"/><path d="M3 17v-4M5.5 17v-6M8 17V9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
        <input id="link" placeholder="Paste a song link…" inputmode="url" autocomplete="off">
      </div>
      <div id="manual" hidden>
        <p class="hint" id="manual-msg"></p>
        <div class="row">
          <input id="m-artist" placeholder="Artist">
          <input id="m-title" placeholder="Song title">
        </div>
      </div>
      <div id="preview"></div>
      <div id="freedl-wrap" class="extra" hidden>
        <label for="freedl">SoundCloud free download link (optional)</label>
        <input id="freedl" placeholder="Paste the download link if the track has one" inputmode="url">
      </div>
      <div class="submit-wrap"><button id="submit" class="btn big" disabled>Summon it</button><svg class="drip" viewBox="0 0 300 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H300V4Q290 4 288 14Q286 24 282 14Q280 4 250 6Q230 4 228 20Q226 26 222 18Q220 6 160 5Q120 4 118 12Q116 18 112 12Q110 4 60 6Q40 4 38 16Q36 24 32 15Q30 5 0 5Z" fill="#2ef2ff"/></svg></div>
    </section>

    <section id="board"></section>

    <section>
      <div class="list-head">
        <h2 class="section-title">The Master Playlist</h2>
        <input id="search" placeholder="Search…">
      </div>
      <div id="playlist" class="list"></div>
    </section>

    <section id="pending-wrap" hidden>
      <h2 class="section-title dim-title">Awaiting the DJ's judgment</h2>
      <div id="pending" class="list"></div>
    </section>

    <details id="graveyard-wrap" class="graveyard" hidden>
      <summary><svg class="tombs" viewBox="0 0 360 90" aria-hidden="true"><g fill="#1b1626" stroke="#4a4160" stroke-width="2">
<path d="M40 90V44a22 22 0 0 1 44 0v46z"/><path d="M110 90V30a28 28 0 0 1 56 0v60z"/><path d="M196 90V50h10V38h10v12h10v40z"/><path d="M260 90V42a20 20 0 0 1 40 0v48z"/></g>
<g fill="#6d6189" font-family="Anton,sans-serif" font-size="13" text-anchor="middle"><text x="138" y="52">RIP</text><text x="280" y="58">RIP</text></g>
<path d="M0 90Q90 80 180 88T360 86V90H0z" fill="#120d1c"/></svg><span class="grave-label">Graveyard <span id="grave-count"></span></span></summary>
      <div id="graveyard" class="list"></div>
    </details>
  </main>

  <footer>Made with 🩸 for one night only.</footer>
  <div id="toast" class="toast"></div>
  <script type="module" src="guest.js"></script>
</body>
</html>
